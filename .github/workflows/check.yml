name: P-Bandai stock check

# Cloud backup: keeps watching while your PC is off.
# GitHub's minimum schedule granularity is 5 minutes, and runs can be delayed a
# few minutes when their queues are busy. Your local tracker is the fast path;
# this is the safety net.
on:
  schedule:
    # Observed reality on a free public repo: asking for 12 runs an hour got
    # about one. GitHub drops scheduled runs aggressively, and high-frequency
    # schedules appear to be culled hardest. Asking for 4 well-spaced runs an
    # hour, off the busy top-of-hour, tends to get a larger share honoured.
    # Treat the cloud as an hourly-ish safety net, not a fast path.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:          # lets you trigger a run by hand from the Actions tab

concurrency:
  group: pbandai-check
  cancel-in-progress: false

permissions:
  contents: write             # needed to commit state.json back for de-duplication

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The browser is ~300MB. Caching it cuts each run from ~2.5 min to ~1 min,
      # which matters if you ever move this to a private repo (billed minutes).
      - name: Cache browser
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          if [[ "${{ steps.browser-cache.outputs.cache-hit }}" == "true" ]]; then
            python -m playwright install-deps chromium
          else
            python -m playwright install --with-deps chromium
          fi

      - name: Check listings
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python app.py once --source "cloud backup"

      - name: Save state, status page and history
        if: always()
        run: |
          # Committing on every single run would mean ~288 commits a day. So:
          # commit immediately when a stock status actually changed, and
          # otherwise only once an hour to refresh STATUS.md and flush the log.
          # state.json changes on EVERY run because last_checked moves, so
          # "did the file change" is the wrong question. Only a status field
          # moving counts as a real change worth an immediate commit.
          STATE_CHANGED="$(git diff -U0 -- state.json \
            | grep -E '^[+-] *"(status|last_known_status)"' || true)"
          MINUTE=$(date -u +%M)

          if [[ -z "$STATE_CHANGED" ]] && (( 10#$MINUTE >= 5 )); then
            echo "No status change. STATUS.md refreshes on the hourly run."
            exit 0
          fi

          git config user.name  "pbandai-tracker"
          git config user.email "actions@github.com"
          git add state.json STATUS.md history.log 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Nothing staged to commit."
            exit 0
          fi

          if [[ -n "$STATE_CHANGED" ]]; then
            git commit -m "status change: $(date -u '+%Y-%m-%d %H:%M UTC')"
          else
            git commit -m "heartbeat: $(date -u '+%Y-%m-%d %H:%M UTC')"
          fi
          for attempt in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "Push attempt $attempt failed, retrying..."
            sleep 5
          done
          echo "Could not push state; next run will re-detect."

      - name: Upload debug output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 7
